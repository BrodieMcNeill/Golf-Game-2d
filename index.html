<!DOCTYPE html><html><head><meta charset="utf-8"><title>Fairway Daily</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#10261a;color:#f2f7ef;font-family:system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:8px;justify-content:space-between;padding:8px 12px;font-size:13px;background:#0008;flex-wrap:wrap}
#hud b{font-size:15px}
#clubs{position:absolute;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px}
#clubs button{background:#0009;color:#fff;border:1px solid #fff4;border-radius:8px;padding:6px 9px;font-size:12px}
#clubs button.on{background:#f4c542;color:#222;border-color:#f4c542}
#clubs button:disabled{opacity:.3}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;background:#10261aee;padding:16px;text-align:center;overflow:auto}
#ov.hide{display:none}#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
.card{background:#1d4030;border:2px solid #3b7a55;border-radius:12px;padding:12px 16px;width:min(320px,90%);cursor:pointer;color:inherit;font:inherit}
.card:hover{border-color:#f4c542}
.btn{background:#f4c542;color:#222;border:0;border-radius:10px;padding:10px 22px;font-size:16px;font-weight:700;cursor:pointer}
table{border-collapse:collapse;font-size:13px}td,th{padding:3px 7px;border:1px solid #fff3}
#map{position:absolute;left:6px;top:calc(env(safe-area-inset-top,0px) + 60px);display:grid;grid-template-columns:repeat(9,24px);gap:2px;text-align:center;font-size:12px;pointer-events:none}#map div{border-radius:4px;padding:1px 0;line-height:1.1}#map small{font-size:9px;opacity:.7}
#yds{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 52px);font-size:36px;font-weight:800;text-shadow:0 2px 8px #000;pointer-events:none}
#ab{position:absolute;top:calc(env(safe-area-inset-top,0px) + 120px);left:50%;transform:translateX(-50%);background:#f4c542;color:#222;padding:8px 14px;border-radius:10px;font-weight:700;pointer-events:none;display:none;z-index:5;text-align:center}
#snd{position:absolute;right:10px;bottom:calc(88px + env(safe-area-inset-bottom,0px));background:#0009;color:#fff;border:1px solid #fff4;border-radius:50%;width:38px;height:38px;font-size:18px}
#toast{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:28px;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><div id="hud"></div><div id="yds"></div><div id="map"></div><div id="clubs"></div><div id="toast"></div><div id="ab"></div><button id="snd">🔊</button><div id="ov"></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),ov=document.getElementById('ov'),hud=document.getElementById('hud'),ydsEl=document.getElementById('yds'),mapEl=document.getElementById('map'),clubsEl=document.getElementById('clubs'),toast=document.getElementById('toast');
const COURSES=[
{n:'Maple Meadows',d:'Wide fairways, gentle hazards',fw:46,haz:3,wat:.2,c:{r:'#4f9a3c',f:'#74c457',g:'#9be06f',s:'#ead99a',w:'#3a8fd0',t:'#2d6a2a'}},
{n:'Dune Ridge',d:'Bunkers everywhere',fw:36,haz:9,wat:.08,c:{r:'#c9b36d',f:'#8fb85a',g:'#a9d572',s:'#f4e8bd',w:'#4aa3c0',t:'#6b7a3a'}},
{n:'Misty Lakes',d:'Water and narrow lines',fw:28,haz:6,wat:.65,c:{r:'#2f6b57',f:'#4d9a6c',g:'#7bd08d',s:'#d8cfa4',w:'#2a6fb0',t:'#1d4a3c'}},
{n:'Tay Links',d:'Scottish links · fast, windy, pot bunkers',fw:40,haz:14,wat:.05,tr:3,wm:1.8,rl:2.2,sr:[3,4],c:{r:'#b0a45a',f:'#8fae5c',g:'#a6cf6b',s:'#eee0b0',w:'#4c8fa8',t:'#6b7a3a'}},
{n:'Magnolia Parkland',d:'Georgia parkland · tree-lined, ponds',fw:34,haz:6,wat:.5,tr:60,wm:.6,rl:1,sr:[6,8],c:{r:'#3f8a37',f:'#66bd4a',g:'#8ee26b',s:'#f6f0d4',w:'#3a8fd0',t:'#1f5a22'}},
{n:'Cliffside Coast',d:'California coast · ocean beside the fairway',fw:38,haz:4,wat:.3,tr:12,wm:1.5,rl:1.2,coast:true,c:{r:'#7aa053',f:'#8cc462',g:'#a6e07a',s:'#efe2b8',w:'#2f87c8',t:'#3d6b3a'}},
{n:'Sonoran Desert',d:'Arizona desert · cacti and waste sand',fw:30,haz:8,wat:.15,tr:40,wm:1,rl:1.5,sr:[10,14],ty:'cactus',c:{r:'#d2a469',f:'#7fb857',g:'#9ad66a',s:'#f2dca0',w:'#4ba3c8',t:'#3f7d3a'}}];
const PARS=[4,3,5,4,4,3,4,5,4,4,5,3,4,4,5,3,4,4];
const CLUBS=[{n:'Putter',m:45},{n:'Wedge',m:95},{n:'7-Iron',m:150},{n:'3-Iron',m:205},{n:'Driver',m:270}];
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let W,H,ci=0,hi=0,scores=[],hole,ball,prev,strokes,phase='menu',club=4,aimOff=0,pw=0,at=0,pt=0,shot=null,cam={x:0,y:0,s:3},best={};
let hio=[],ach={},stat={perf:0,splash:0,courses:{}},lastY=0,rb=0,rs=0;
try{const sv=JSON.parse(localStorage.getItem('fdSave')||'null');if(sv){best=sv.best||{};hio=sv.hio||[];ach=sv.ach||{};stat=Object.assign(stat,sv.stat||{})}else best=JSON.parse(localStorage.getItem('fdBest')||'{}')}catch(e){}
const PAR=72,save=()=>{try{localStorage.setItem('fdSave',JSON.stringify({best,hio,ach,stat}))}catch(e){}},fmt=n=>n==0?'E':n>0?'+'+n:''+n;
const ACH=[{id:'birdie',n:'Birdie Time',d:'Make a birdie'},{id:'eagle',n:'Eagle Eye',d:'Make an eagle or better'},{id:'ace',n:'Ace!',d:'Hit a hole-in-one'},{id:'perf',n:'Perfectionist',d:'Hit the green zone 10 times'},{id:'bomber',n:'Bomber',d:'Drive 250+ yards'},{id:'swim',n:'Swimmer',d:'Find the water 5 times'},{id:'under',n:'Under Par',d:'Finish a round under par'},{id:'clean',n:'Clean Card',d:'Finish a round with no bogeys'},{id:'master',n:'Course Master',d:'Finish every course'},{id:'alb',n:'Albatross',d:'Score 3 under par on a hole'},{id:'hat',n:'Hat Trick',d:'3 birdies in one round'},{id:'streak',n:'Par Machine',d:'5 pars or better in a row'},{id:'sub70',n:'Break 70',d:'Shoot 69 or lower'},{id:'wind',n:'Wind Rider',d:'Hit the green zone in 8+ mph wind'},{id:'links',n:'Links Legend',d:'Finish Tay Links at par or better'},{id:'regular',n:'Regular',d:'Complete 5 rounds'},{id:'perf100',n:'Swing Master',d:'Hit the green zone 100 times'}];
let AC=null;
function ac(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state=='suspended')AC.resume();return AC}
function tone(f,d,ty='sine',v=.15,t0=0,f2){const a=ac();if(!a||stat.mute)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function noise(d,v=.2,f=1500,f2,t0=0){const a=ac();if(!a||stat.mute)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const sr=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+t0;sr.buffer=b;fl.type='lowpass';fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);sr.connect(fl);fl.connect(g);g.connect(a.destination);sr.start(t)}
const SFX={tick:()=>tone(660,.06,'square',.05),hit:()=>{noise(.08,.35,4000,300);tone(180,.12,'sine',.3,0,60)},perfect:()=>{tone(880,.15,'triangle',.15,.05);tone(1320,.25,'triangle',.12,.15)},thud:()=>{tone(90,.12,'sine',.25,0,50);noise(.1,.15,600,200)},splash:()=>noise(.5,.4,3000,200),cup:()=>{tone(1200,.08,'triangle',.2);tone(800,.15,'triangle',.2,.08);noise(.1,.1,2000)},cheer:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.15,.3+i*.1)),sad:()=>tone(300,.4,'sawtooth',.08,.3,150),ach:()=>[784,988,1319].forEach((f,i)=>tone(f,.3,'sine',.15,i*.12)),sand:()=>noise(.15,.25,900,300),tree:()=>{noise(.2,.3,1500,400);tone(120,.15,'square',.1)}};
const sfx=n=>{try{SFX[n]()}catch(e){}};
const sndB=document.getElementById('snd');sndB.textContent=stat.mute?'🔇':'🔊';sndB.onclick=()=>{stat.mute=!stat.mute;sndB.textContent=stat.mute?'🔇':'🔊';save()};
let abT;function unlock(id){if(ach[id])return;ach[id]=Date.now();save();sfx('ach');const a=ACH.find(q=>q.id==id),b=document.getElementById('ab');b.innerHTML='🎖 Achievement unlocked<br>'+a.n;b.style.display='block';clearTimeout(abT);abT=setTimeout(()=>b.style.display='none',3000)}
function resize(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}addEventListener('resize',resize);resize();

function gen(c,h){
 const C=COURSES[c],r=rng(c*977+h*31+5),par=PARS[(h+c*5)%18];
 const L=par==3?120+r()*70:par==4?290+r()*110:450+r()*80;
 const bend=par>3&&r()<.6?(r()<.5?-1:1)*(25+r()*55):0;
 const pts=[[0,0],[bend,-L*.55],[-bend*.3+(r()-.5)*30,-L]];
 const at_=t=>t<.5?[pts[0][0]+(pts[1][0]-pts[0][0])*t*2,pts[0][1]+(pts[1][1]-pts[0][1])*t*2]:[pts[1][0]+(pts[2][0]-pts[1][0])*(t-.5)*2,pts[1][1]+(pts[2][1]-pts[1][1])*(t-.5)*2];
 const hz=[],trees=[],pin={x:pts[2][0],y:pts[2][1]};
 for(let i=0;i<C.haz;i++){const t=.25+r()*.7,p=at_(t),sd=r()<.5?-1:1,w=r()<C.wat;
  hz.push({x:p[0]+sd*(C.fw/2+r()*12-6),y:p[1],r:(C.sr?C.sr[0]:6)+r()*(C.sr?C.sr[1]:9),w});}
 for(let i=0;i<(C.wat>.5?2:1)+(r()<.5?1:0);i++){const t=.3+r()*.55,p=at_(t),sd=r()<.5?-1:1,rr=11+r()*10;hz.push({x:p[0]+sd*(C.fw/2-3+r()*10),y:p[1],r:rr,w:true,pond:true})}
 if(C.wat>.5)hz.push({x:pin.x+(r()-.5)*10,y:pin.y+32,r:14,w:true});
 for(let i=0;i<3;i++){const a=r()*6.28;hz.push({x:pin.x+Math.cos(a)*21,y:pin.y+Math.sin(a)*21,r:5+r()*3,w:false})}
 for(let i=0;i<(C.tr??34);i++){const p=at_(r()),sd=r()<.5?-1:1;trees.push({x:p[0]+sd*(C.fw/2+8+r()*45),y:p[1]+(r()-.5)*20,r:3+r()*3})}
 if(C.coast){const sd=r()<.5?-1:1;for(let t=.12;t<1;t+=.1){const p=at_(t);hz.push({x:p[0]+sd*(C.fw/2+44+r()*8),y:p[1],r:34,w:true})}}
 return{par,L,pts,pin,hz,trees,C,wind:{a:r()*6.28,v:Math.round(r()*10*(C.wm||1))},slope:{x:(r()-.5)*.1,y:(r()-.5)*.1}}}
function dSeg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((p.x-a[0])*dx+(p.y-a[1])*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a[0]-dx*t,p.y-a[1]-dy*t)}
function terr(p){
 for(const z of hole.hz)if(z.w&&Math.hypot(p.x-z.x,p.y-z.y)<z.r)return'w';
 if(Math.hypot(p.x-hole.pin.x,p.y-hole.pin.y)<15)return'g';
 for(const z of hole.hz)if(!z.w&&Math.hypot(p.x-z.x,p.y-z.y)<z.r)return's';
 const d=Math.min(dSeg(p,hole.pts[0],hole.pts[1]),dSeg(p,hole.pts[1],hole.pts[2]));
 return d<hole.C.fw/2||Math.hypot(p.x,p.y)<8?'f':'r'}
const treeAt=p=>hole.trees.find(t=>Math.hypot(p.x-t.x,p.y-t.y)<t.r);
const LIE={f:'Fairway',g:'Green',s:'Bunker',r:'Rough',w:'Water'},MOD={f:1,g:1,s:.6,r:.8};

function menu(){phase='menu';clubsEl.innerHTML='';hud.innerHTML='';mapEl.innerHTML='';ydsEl.textContent='';
 ov.className='';ov.innerHTML='<h1 style="margin:0">⛳ Fairway Daily</h1><div style="opacity:.8;max-width:320px">Tap / Space to stop the aim bar, then again to stop the power bar. 3 courses × 18 holes.</div>'+
 COURSES.map((c,i)=>`<button class="card" data-i="${i}"><b style="font-size:18px">${c.n}</b><br>${c.d}<br><small>🏆 Course record: ${best[i]!=null?best[i]+' ('+fmt(best[i]-PAR)+')':'—'}</small></button>`).join('')+`<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn" id="bd">⛳ Ace Board (${hio.length})</button><button class="btn" id="ac">🎖 Achievements (${Object.keys(ach).length}/${ACH.length})</button></div>`;
 ov.querySelectorAll('.card').forEach(b=>b.onclick=()=>{ci=+b.dataset.i;hi=0;scores=[];rb=rs=0;load()});document.getElementById('bd').onclick=board;document.getElementById('ac').onclick=achs}
function board(){ov.innerHTML=`<h2 style="margin:0">⛳ Hole-in-One Board</h2>`+(hio.length?`<table><tr><th>#</th><th>Course</th><th>Hole</th><th>Yds</th><th>Date</th></tr>${hio.slice().reverse().map((e,i)=>`<tr><td>${hio.length-i}</td><td>${COURSES[e.c].n}</td><td>${e.h}</td><td>${e.y}</td><td>${e.d}</td></tr>`).join('')}</table>`:'<div style="opacity:.8">No aces yet. Keep swinging!</div>')+'<button class="btn" id="bk">Back</button>';document.getElementById('bk').onclick=menu}
function achs(){ov.innerHTML=`<h2 style="margin:0">🎖 Achievements</h2>`+ACH.map(a=>`<div class="card" style="cursor:default;opacity:${ach[a.id]?1:.55}"><b>${ach[a.id]?'✅':'🔒'} ${a.n}</b><br><small>${a.d}${ach[a.id]?' · '+new Date(ach[a.id]).toLocaleDateString():''}</small></div>`).join('')+'<button class="btn" id="bk">Back</button>';document.getElementById('bk').onclick=menu}
function load(){ov.className='hide';hole=gen(ci,hi);ball={x:0,y:0};prev={...ball};strokes=0;pick();begin();cam={x:0,y:-60,s:3}}
function begin(){phase='aim';at=0;pt=0;shot=null;buildClubs();hudUpd()}
function pick(){const d=dist(ball,hole.pin),t=terr(ball);
 if(t=='g'){club=0;return}
 const m=MOD[t]||1;club=4;for(let i=1;i<5;i++)if(CLUBS[i].m*m>=d){club=i;break}}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function buildClubs(){const g=terr(ball)=='g';clubsEl.innerHTML='';CLUBS.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.n;b.className=i==club?'on':'';b.disabled=g?i>0:i==0&&dist(ball,hole.pin)>60;b.onclick=e=>{e.stopPropagation();if(phase=='aim'){club=i;buildClubs()}};clubsEl.appendChild(b)})}
function hudUpd(){mapUpd();const t=terr(ball);hud.innerHTML=`<span>${COURSES[ci].n}</span><span>Hole <b>${hi+1}</b>/18</span><span>Par <b>${hole.par}</b></span><span>Stroke <b>${strokes+1}</b></span><span><b>${Math.round(dist(ball,hole.pin))}</b> yds</span><span>${LIE[t]}${t=='g'&&ring()?' · '+ring()+'-putt range':''}</span>${t=='g'?`<span>Break <span style="display:inline-block;transform:rotate(${Math.atan2(hole.slope.y,hole.slope.x)*180/Math.PI}deg)">➤</span></span>`:''}<span>Wind <b>${hole.wind.v}</b> mph <span style="display:inline-block;transform:rotate(${Math.atan2(-Math.cos(hole.wind.a),Math.sin(hole.wind.a))*180/Math.PI}deg)">➤</span></span>`}
function mapUpd(){let tot=0,th=0;const cells=[...Array(18)].map((_,i)=>{const v=scores[i],p=PARS[(i+ci*5)%18];let t='·',bg='#0007';if(v!=null){const d=v-p;tot+=d;th++;t=d==0?'E':d>0?'+'+d:d;bg=d<0?'#2a8a4a':d>0?'#8a3a2a':'#456'}return`<div style="background:${bg};outline:${i==hi?'2px solid #f4c542':'none'}"><small>${i+1}</small><br>${t}</div>`}).join('');
 mapEl.innerHTML=`<div style="grid-column:1/-1;font-size:11px;text-align:left;text-shadow:0 1px 3px #000">Score <b>${tot==0?'E':tot>0?'+'+tot:tot}</b> thru ${th}</div>`+cells}
function fin_(pre=''){phase='done';const df=strokes-hole.par;const n=strokes==1?'Hole in one!':df<=-3?'Albatross!':df==-2?'Eagle!':df==-1?'Birdie!':df==0?'Par':df==1?'Bogey':df==2?'Double bogey':'+'+df;scores[hi]=strokes;if(df<=-1)unlock('birdie');if(df<=-2)unlock('eagle');if(df<=-3)unlock('alb');if(df<=-1){rb++;if(rb>=3)unlock('hat')}if(df<=0){rs++;if(rs>=5)unlock('streak')}else rs=0;if(df<=-1)sfx('cheer');else if(df>=2)sfx('sad');if(strokes==1&&!pre){unlock('ace');hio.push({c:ci,h:hi+1,y:lastY,d:new Date().toLocaleDateString()});save()}clubsEl.innerHTML='';mapUpd();say(pre+n+' — tap to continue',9999)}
function say(m,ms=1400){toast.textContent=m;setTimeout(()=>{if(toast.textContent==m)toast.textContent=''},ms)}

const base=()=>Math.atan2(hole.pin.x-ball.x,-(hole.pin.y-ball.y));
const ring=()=>{const d=dist(ball,hole.pin);return d<3?1:d<7?2:d<12?3:0};const aimR=()=>club==0?.25:.7;
function zone(){const d=dist(ball,hole.pin);if(club==0)return{c:Math.min(1,(d+1)/45),w:d<3?.2:d<7?.14:d<12?.1:.07};return{c:.78+club*.045,w:.04}}
const aimV=()=>Math.sin(at*1.7),powV=()=>(1-Math.cos(pt*3.4))/2;
function advance(){ac();
 if(phase=='aim'){aimOff=aimV()*aimR();phase='power';pt=0;sfx('tick')}
 else if(phase=='power'){pw=powV();fire()}
 else if(phase=='done'){next()}}
function fire(){
 const cl=CLUBS[club],t=terr(ball),m=MOD[t]||1,z=zone(),perf=Math.abs(pw-z.c)<=z.w/2;if(perf){pw=z.c;say('Perfect!',700)}
 const err=perf?0:(Math.abs(pw-z.c)-z.w/2)*(club==0?.1:.35)*(Math.random()*2-1),d=cl.m*pw*m,a=base()+aimOff+err,dir={x:Math.sin(a),y:-Math.cos(a)},wd=hole.wind,wk=wd.v*.004*d;lastY=Math.round(dist(ball,hole.pin));if(perf){stat.perf++;if(stat.perf>=10)unlock('perf');if(stat.perf>=100)unlock('perf100');if(wd.v>=8)unlock('wind')}if(club==4&&d>=250)unlock('bomber');
 strokes++;sfx('hit');if(perf)sfx('perfect');if(t=='s')sfx('sand');let land,fin,putt=club==0;
 if(putt){land={...ball};fin={x:ball.x+dir.x*d+hole.slope.x*d,y:ball.y+dir.y*d+hole.slope.y*d}}
 else{land={x:ball.x+dir.x*d+Math.sin(wd.a)*wk,y:ball.y+dir.y*d-Math.cos(wd.a)*wk};const lt=terr(land),rf=(lt=='g'?.2:lt=='f'?.1:lt=='r'?.03:0)*(lt=='g'?1:hole.C.rl||1);
  const tr=treeAt(land);fin=lt=='w'||tr?land:{x:land.x+dir.x*d*rf,y:land.y+dir.y*d*rf}}
 const seg=putt?[ball,fin]:[land,fin];let holed=false;
 const dd=dSeg(hole.pin,[seg[0].x,seg[0].y],[seg[1].x,seg[1].y]);
 if(dd<1.2&&(!putt||d-dist(ball,hole.pin)<14))holed=true;
 if(holed)fin={...hole.pin};
 shot={s:{...ball},l:land,f:fin,putt,t:0,d1:putt?0:.5+d/220,d2:Math.max(.15,Math.hypot(fin.x-land.x,fin.y-land.y)/25),holed,h:d*.14,lw:!putt&&terr(land)=='w'};
 phase='fly';buildClubs();clubsEl.innerHTML=''}
function land(){
 const s=shot;shot=null;
 if(s.holed){sfx('cup');fin_();return}
 if(s.lw||terr(s.f)=='w'){sfx('splash');strokes++;say('💦 Splash! +1 stroke penalty',1800);stat.splash++;if(stat.splash>=5)unlock('swim');save();ball={...prev}}
 else{ball={...s.f};const tr=treeAt(ball);sfx(tr?'tree':'thud');if(tr){say('Hit a tree!');ball.x+=tr.r+2}prev={...ball}}
 if(terr(ball)=='g'){const n=ring()||3;strokes+=n;sfx('cup');fin_(n+(n==1?' putt · ':' putts · '));return}
 if(strokes>=8){scores[hi]=strokes+2;phase='done';say('Pick up — tap to continue',9999);return}
 pick();begin()}
function next(){toast.textContent='';hi++;if(hi>=18)return finish();load()}
function finish(){phase='end';clubsEl.innerHTML='';hud.innerHTML='';mapEl.innerHTML='';ydsEl.textContent='';
 const tot=scores.reduce((a,b)=>a+b,0),par=PARS.reduce((a,b)=>a+b,0);let nb=best[ci]==null||tot<best[ci];if(nb)best[ci]=tot;stat.courses[ci]=1;if(tot<par)unlock('under');if(tot<70)unlock('sub70');if(ci==3&&tot<=par)unlock('links');stat.rounds=(stat.rounds||0)+1;if(stat.rounds>=5)unlock('regular');if(scores.every((v,i)=>v<=PARS[(i+ci*5)%18]))unlock('clean');if(Object.keys(stat.courses).length>=COURSES.length)unlock('master');save();
 const row=(a,b)=>'<tr>'+a.map(v=>`<td>${v}</td>`).join('')+'</tr>';
 const idx=i=>i+1;ov.className='';
 ov.innerHTML=`<h2 style="margin:0">${COURSES[ci].n} complete</h2><div style="font-size:26px"><b>${tot}</b> (${tot-par>0?'+':''}${tot-par||'E'})<div>${nb?'🏆 New course record!':'Course record: '+best[ci]}</div></div>
 <table><tr><th>Hole</th>${scores.map((_,i)=>`<td>${i+1}</td>`).join('').slice(0,0)}<td colspan=9>1–9</td></tr></table>
 <table>${[0,9].map(o=>'<tr><th>#</th>'+scores.slice(o,o+9).map((_,i)=>`<td>${o+i+1}</td>`).join('')+'</tr><tr><th>Par</th>'+scores.slice(o,o+9).map((_,i)=>`<td>${PARS[(o+i+ci*5)%18]}</td>`).join('')+'</tr><tr><th>You</th>'+scores.slice(o,o+9).map((v,i)=>{const d=v-PARS[(o+i+ci*5)%18];return`<td style="background:${d<0?'#2a8a4a':d>0?'#8a3a2a':'none'}">${v}</td>`}).join('')+'</tr>').join('')}</table>
 <button class="btn" id="mn">Choose course</button>`;document.getElementById('mn').onclick=menu}

function update(dt){
 if(phase=='aim')at+=dt;if(phase=='power')pt+=dt;
 if(shot){shot.t+=dt;if(shot.t>=shot.d1+shot.d2)land()}
 const b=shot?shot.pos||ball:ball,p=hole.pin,s=Math.max(1.5,Math.min(9,Math.min(W/devicePixelRatio*.8/(Math.abs(b.x-p.x)+60),(H/devicePixelRatio-200)*.8/(Math.abs(b.y-p.y)+60))));
 const k=Math.min(1,dt*4);cam.x+=((b.x+p.x)/2-cam.x)*k;cam.y+=((b.y+p.y)/2-cam.y)*k;cam.s+=(s-cam.s)*k}
function ballPos(){
 if(!shot)return{...ball,z:0};const s=shot;
 if(s.t<s.d1){const u=s.t/s.d1;return{x:s.s.x+(s.l.x-s.s.x)*u,y:s.s.y+(s.l.y-s.s.y)*u,z:Math.sin(Math.PI*u)*s.h}}
 const u=Math.min(1,(s.t-s.d1)/s.d2),e=1-Math.pow(1-u,3);return{x:s.l.x+(s.f.x-s.l.x)*e,y:s.l.y+(s.f.y-s.l.y)*e,z:0}}
const circ=(o,r,f)=>{x.beginPath();x.arc(o.x,o.y,r,0,7);x.fillStyle=f;x.fill()};
function draw(){
 const C=hole.C.c,dpr=devicePixelRatio;x.setTransform(1,0,0,1,0,0);x.fillStyle=C.r;x.fillRect(0,0,W,H);
 const sc=cam.s*dpr;x.setTransform(sc,0,0,sc,W/2-cam.x*sc,H/2-cam.y*sc);
 x.strokeStyle=C.f;x.lineWidth=hole.C.fw;x.lineCap=x.lineJoin='round';x.beginPath();hole.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
 circ({x:0,y:0},8,C.g);circ(hole.pin,15.5,C.f);circ(hole.pin,14,C.g);
 [12,7,3].forEach((r,i)=>{x.strokeStyle='#fff';x.globalAlpha=.55;x.lineWidth=.35;x.setLineDash([1.5,1]);x.beginPath();x.arc(hole.pin.x,hole.pin.y,r,0,7);x.stroke();x.setLineDash([]);x.globalAlpha=1;x.fillStyle='#fff9';x.font='2.4px system-ui';x.fillText(3-i,hole.pin.x-.6,hole.pin.y-r+2.6)});
 hole.hz.forEach(z=>{if(z.w){circ(z,z.r+1.8,'#e9e2b8');circ(z,z.r,C.w);x.strokeStyle='#fff6';x.lineWidth=.4;x.beginPath();x.arc(z.x,z.y,z.r*.6,.3,2.2);x.stroke();x.beginPath();x.arc(z.x,z.y,z.r*.35,3.4,5.2);x.stroke()}else circ(z,z.r,C.s)});
 circ(hole.pin,.9,'#111');x.strokeStyle='#eee';x.lineWidth=.35;x.beginPath();x.moveTo(hole.pin.x,hole.pin.y);x.lineTo(hole.pin.x,hole.pin.y-9);x.stroke();
 x.fillStyle='#e33';x.beginPath();x.moveTo(hole.pin.x,hole.pin.y-9);x.lineTo(hole.pin.x+5,hole.pin.y-7);x.lineTo(hole.pin.x,hole.pin.y-5);x.fill();
 hole.trees.forEach(t=>{if(hole.C.ty=='cactus'){x.fillStyle=C.t;x.fillRect(t.x-.5,t.y-t.r,1,t.r*2);x.fillRect(t.x-t.r*.7,t.y-t.r*.3,t.r*1.4,.9);x.fillRect(t.x-t.r*.7,t.y-t.r*.9,.8,t.r*.7)}else{circ({x:t.x+.8,y:t.y+.8},t.r,'#0004');circ(t,t.r,C.t);circ({x:t.x-t.r*.25,y:t.y-t.r*.25},t.r*.6,'#fff2')}});
 const bp=ballPos(),a=base()+(phase=='aim'?aimV()*aimR():aimOff),dir={x:Math.sin(a),y:-Math.cos(a)},cl=CLUBS[club];
 if(phase=='aim'||phase=='power'){
  const len=phase=='power'?cl.m*powV()*(MOD[terr(ball)]||1):cl.m*(MOD[terr(ball)]||1);
  x.strokeStyle='#fff';x.globalAlpha=.8;x.lineWidth=.6;x.setLineDash([2,2]);x.beginPath();x.moveTo(ball.x,ball.y);x.lineTo(ball.x+dir.x*len,ball.y+dir.y*len);x.stroke();x.setLineDash([]);x.globalAlpha=1;
  if(phase=='power')circ({x:ball.x+dir.x*len,y:ball.y+dir.y*len},1.6,'#f4c542')}
 if(phase!='end')ydsEl.textContent=Math.round(dist(bp,hole.pin))+' yds';const r=Math.max(1,2.4/cam.s);circ({x:bp.x+.5,y:bp.y+.5},r,'#0005');circ({x:bp.x,y:bp.y-bp.z},r,'#fff');
 x.setTransform(1,0,0,1,0,0);x.scale(dpr,dpr);bars()}
function bars(){
 const w=Math.min(innerWidth-40,420),l=(innerWidth-w)/2,h=innerHeight,ay=h-72-0,py=h-40;
 const bar=(y,v,lock,lab)=>{x.fillStyle='#0009';x.fillRect(l,y,w,22);const g=x.createLinearGradient(l,0,l+w,0);
  if(lab=='AIM'){g.addColorStop(0,'#c44');g.addColorStop(.35,'#ec4');g.addColorStop(.5,'#4c6');g.addColorStop(.65,'#ec4');g.addColorStop(1,'#c44')}else{g.addColorStop(0,'#4c6');g.addColorStop(.7,'#ec4');g.addColorStop(1,'#c44')}
  x.globalAlpha=lock?.35:.9;x.fillStyle=g;x.fillRect(l+3,y+3,w-6,16);x.globalAlpha=1;
  if(lab=='POWER'&&phase!='done'){const z=zone();x.fillStyle='#3f6';x.globalAlpha=.7+.3*Math.sin(performance.now()/150);x.fillRect(l+3+(w-6)*(z.c-z.w/2),y+1,(w-6)*z.w,20);x.globalAlpha=1}
  x.fillStyle='#fff';x.fillRect(l+3+(w-6)*v-3,y-3,6,28);x.font='11px system-ui';x.fillStyle='#fffc';x.fillText(lab,l+6,y-6)};
 const aimLocked=phase!='aim',on=phase=='aim'||phase=='power';
 if(!on&&phase!='fly')return;
 bar(h-82,phase=='aim'?(aimV()+1)/2:(aimOff/aimR()+1)/2,aimLocked,'AIM');
 bar(h-48,phase=='power'?powV():phase=='fly'?pw:0,phase=='aim','POWER');}
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(hole&&phase!='menu'&&phase!='end'){update(dt);draw()}else if(hole&&phase=='end'){draw()}requestAnimationFrame(loop)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();advance()});
addEventListener('keydown',e=>{if(e.code=='Space'){e.preventDefault();if(ov.className=='hide')advance()}});
menu();requestAnimationFrame(loop);
